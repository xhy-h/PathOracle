[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pathoracle-cpu-mvp"
version = "0.1.0"
description = "CPU MVP of PathOracle — skip transformer middle layers with a small oracle network"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30",
    "datasets>=2.10",
    "numpy>=1.24",
    "tqdm>=4.60",
]
